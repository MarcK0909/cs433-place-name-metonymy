[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cs433-place-name-metonymy"
version = "0.1.0"
description = "EPFL CS-433 project on binary place-name metonymy classification."
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "scikit-learn",
    "pytest",
]

[project.optional-dependencies]
contrastive = ["torch==2.9.1"]
encoder = ["torch==2.9.1", "transformers==5.12.1", "numpy==2.2.6", "scipy==1.16.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
"metonymy.group1" = ["LICENSE", "NOTICE.md", "data_reference.json"]
